version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm:
        update-types: ["minor", "patch"]
    ignore:
      # vite is aliased to Vite+'s core and moves with vite-plus; bump them together by hand.
      - dependency-name: "vite"
      - dependency-name: "vite-plus"
      # TypeScript 7 (the native compiler) has no JS compiler API, so vue-tsc can't run on it
      # (#5432). Stay on 6.x, the last JS release.
      - dependency-name: "typescript"
        versions: [">=7"]
