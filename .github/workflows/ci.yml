name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job name "Tests" is the required check on main: keep it unchanged.
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real SFTP server for tests/Feature/WorldStorage/SftpIntegrationTest (#5288).
    services:
      sftp:
        image: atmoz/sftp:alpine
        ports:
          - 2222:22
        # user:password:uid:gid:folder. It's up long before PHPUnit runs (installs and the build come first).
        env:
          SFTP_USERS: mvm:mvm-test:1001:1001:upload
      # S3-compatible world storage (#5347): S3IntegrationTest's pre-signed multipart round trip.
      s3:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: mvm-worlds

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, bcmath, intl, ftp, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Build frontend (generates Wayfinder routes)
        run: npm run build

      - name: Lint and format (Vite+)
        run: npm run check

      - name: Type-check (vue-tsc)
        run: npm run types:check

      - name: Tests (PHPUnit)
        run: php artisan test
        env:
          MVM_SFTP_TEST_HOST: 127.0.0.1
          MVM_SFTP_TEST_PORT: '2222'
          MVM_SFTP_TEST_USER: mvm
          MVM_SFTP_TEST_PASSWORD: mvm-test
          MVM_S3_TEST_ENDPOINT: http://127.0.0.1:9090
          MVM_S3_TEST_BUCKET: mvm-worlds

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
